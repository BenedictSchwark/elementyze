<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>
    <meta name="description" content="Welcome to my personal website.">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", sans-serif;
            color: #f8fafc;
            background: linear-gradient(135deg, #0f172a, #1e293b);
        }

        main {
            max-width: 700px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 8px 14px;
            margin-bottom: 20px;
            border: 1px solid #475569;
            border-radius: 999px;
            color: #cbd5e1;
            font-size: 14px;
        }

        h1 {
            margin: 0 0 20px;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            letter-spacing: -0.05em;
        }

        p {
            margin: 0 auto 30px;
            max-width: 550px;
            color: #cbd5e1;
            font-size: 1.15rem;
            line-height: 1.8;
        }

        a {
            display: inline-block;
            padding: 14px 24px;
            border-radius: 10px;
            background: #38bdf8;
            color: #0f172a;
            font-weight: 700;
            text-decoration: none;
            transition: background 0.2s;
        }

        a:hover {
            background: #7dd3fc;
        }
    </style>
</head>

<body>
    <main>
        <span class="badge">ELEMENTYZE</span>

        <h1>Welcome to ELEMENTYZE</h1>

        <p>
            This is the most important ELEMENTYZE website currently online!
        </p>

        <a href="https://www.tugraz.at/en/arbeitsgruppen/nhb/research/research-overview/wlcoe">Visit WLCÖ</a>
    </main>
</body>
</html>
